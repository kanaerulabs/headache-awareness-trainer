name: Deploy to Production

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Deploy to Vercel Production
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Run Smoke Tests
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.preview-url }}"
          echo "Running smoke tests against $DEPLOY_URL"

          # Wait for deployment to be fully ready
          sleep 10

          # Test 1: Site is reachable (follow redirects - app redirects to /onboarding for new users)
          HTTP_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$DEPLOY_URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Site returned HTTP $HTTP_STATUS (expected 200)"
            exit 1
          fi
          echo "✅ Site is reachable (HTTP 200)"

          # Test 2: Check that page content loads (follow redirects)
          PAGE_CONTENT=$(curl -sL "$DEPLOY_URL")
          if ! echo "$PAGE_CONTENT" | grep -qi "headache"; then
            echo "❌ Page content missing expected text"
            exit 1
          fi
          echo "✅ Page content verified"

          # Test 3: Login page accessible
          LOGIN_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$DEPLOY_URL/login")
          if [ "$LOGIN_STATUS" = "200" ]; then
            echo "✅ Login page accessible"
          else
            echo "⚠️ Login page returned HTTP $LOGIN_STATUS"
          fi

          echo "🎉 All smoke tests passed!"

      - name: Post deployment summary
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.preview-url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Smoke Tests:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
