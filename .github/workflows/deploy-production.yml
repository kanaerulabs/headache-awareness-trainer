name: Deploy to Production

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Deploy to Vercel Production
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Run Smoke Tests
        run: |
          echo "Running smoke tests against ${{ steps.deploy.outputs.url }}"

          # Wait for deployment to be fully ready
          sleep 10

          # Test 1: Homepage loads successfully
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Homepage returned HTTP $HTTP_STATUS (expected 200)"
            exit 1
          fi
          echo "✅ Homepage loads (HTTP 200)"

          # Test 2: Check that critical page assets are present
          PAGE_CONTENT=$(curl -s "${{ steps.deploy.outputs.url }}")
          if ! echo "$PAGE_CONTENT" | grep -q "Headache"; then
            echo "❌ Page content missing expected text"
            exit 1
          fi
          echo "✅ Page content verified"

          # Test 3: API health check (Next.js API route)
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/api/health" || echo "404")
          if [ "$API_STATUS" = "200" ]; then
            echo "✅ API health endpoint available"
          else
            echo "⚠️ API health endpoint not available (optional)"
          fi

          echo "🎉 All smoke tests passed!"

      - name: Post deployment summary
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Smoke Tests:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
