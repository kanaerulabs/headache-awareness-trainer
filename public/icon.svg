<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333EA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#grad)"/>
  <!-- Head silhouette with awareness waves -->
  <g fill="white">
    <!-- Simplified head shape -->
    <ellipse cx="256" cy="220" rx="100" ry="110"/>
    <!-- Neck -->
    <rect x="216" y="310" width="80" height="60" rx="10"/>
    <!-- Awareness waves emanating -->
    <path d="M120 200 Q80 256 120 320" stroke="white" stroke-width="12" fill="none" opacity="0.6"/>
    <path d="M90 180 Q40 256 90 340" stroke="white" stroke-width="8" fill="none" opacity="0.4"/>
    <path d="M392 200 Q432 256 392 320" stroke="white" stroke-width="12" fill="none" opacity="0.6"/>
    <path d="M422 180 Q472 256 422 340" stroke="white" stroke-width="8" fill="none" opacity="0.4"/>
    <!-- Brain awareness indicator -->
    <circle cx="256" cy="200" r="40" fill="url(#grad)" opacity="0.3"/>
    <circle cx="256" cy="200" r="25" fill="white" opacity="0.5"/>
  </g>
  <!-- Text: HA for Headache Awareness -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white">AWARE</text>
</svg>
